name: Build & Deploy MyKas (PWA Web & Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Tarik Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (3.24.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # Setup Android Platform, App Name, Fixed Keystore & Icons
      - name: Setup Android Platform & Configure Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.mykas.app --project-name mykas
          
          # 1. Ubah Nama Tampilan Aplikasi di Android menjadi MyKas
          sed -i 's/android:label="mykas"/android:label="MyKas"/g' android/app/src/main/AndroidManifest.xml
          
          # 2. Generate Ikon Khusus Android
          dart run flutter_launcher_icons
          
          # 3. Biometrik FragmentActivity Fix
          mkdir -p android/app/src/main/kotlin/com/mykas/app/mykas
          cat << 'EOF' > android/app/src/main/kotlin/com/mykas/app/mykas/MainActivity.kt
          package com.mykas.app.mykas

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity() {
          }
          EOF

          # 4. Pasang Keystore Abadi ke Folder Android & Konfigurasi Gradle Release Signing
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore android/app/debug.keystore

          # Paksa Gradle Release menggunakan Keystore Abadi
          sed -i 's/signingConfigs {/signingConfigs {\n        release {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }/g' android/app/build.gradle
          sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }/g' android/app/build.gradle

      # 5. Build Flutter Web PWA
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/MyKas/" --no-tree-shake-icons

      # 6. Build APK Android Release dengan Kunci Abadi
      - name: Build Android APK
        run: flutter build apk --release

      # 7. Upload Web Artifact
      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # 8. Upload File APK ke Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyKas-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy-web:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
