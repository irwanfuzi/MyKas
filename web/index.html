<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <script>
    // Deteksi Base Href Otomatis (Support Vercel & GitHub Pages)
    (function() {
      var path = window.location.pathname;
      var baseHref = '/';
      if (path.indexOf('/MyKas') === 0) {
        baseHref = '/MyKas/';
      }
      var baseEl = document.querySelector('base');
      if (baseEl) {
        baseEl.href = baseHref;
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- Viewport Fleksibel untuk Mobile & Desktop Site Mode HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="MyKas - Own Your Money">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyKas">
  <meta name="theme-color" content="#0052FF">

  <!-- Favicons & Manifest -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <title>MyKas - Own Your Money</title>

  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #0052FF;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #94A3B8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Menggunakan Loader Resmi Flutter 3.24+ -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <div class="loading-container" id="app-loading">
    <div class="spinner"></div>
    <div class="loading-text">Memuat MyKas...</div>
  </div>

  <script>
    function removeLoading() {
      var el = document.getElementById('app-loading');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() {
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 300);
      }
    }

    // Unregister Service Worker lama
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Hilangkan Spinner begitu Flutter selesai menggambar layar
    window.addEventListener('flutter-first-frame', removeLoading);
    
    // Safety Fallback: hilangkan spinner setelah 5 detik jika event tertahan
    setTimeout(removeLoading, 5000);
  </script>
</body>
</html>
